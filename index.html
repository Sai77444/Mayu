#include <string>
using namespace std;

class Song
{
private:
    int songID;
    string songTitle;
    string artistName;
    string albumName;
    string genre;
    float duration;

public:
    Song()
    {
        songID = 0;
        songTitle = "Unknown";
        artistName = "Unknown";
        albumName = "Unknown";
        genre = "Unknown";
        duration = 0;
        cout << "Default Constructor Called" << endl;
    }

    Song(int id, string title, string artist,
         string album, string g, float d)
    {
        songID = id;
        songTitle = title;
        artistName = artist;
        albumName = album;
        genre = g;
        duration = d;
        cout << "Parameterized Constructor Called" << endl;
    }

    Song(const Song &s)
    {
        songID = s.songID;
        songTitle = s.songTitle;
        artistName = s.artistName;
        albumName = s.albumName;
        genre = s.genre;
        duration = s.duration;
        cout << "Copy Constructor Called" << endl;
    }

    void display()
    {
        cout << "Song ID: " << songID << endl;
        cout << "Title: " << songTitle << endl;
        cout << "Artist: " << artistName << endl;
        cout << "Album: " << albumName << endl;
        cout << "Genre: " << genre << endl;
        cout << "Duration: " << duration << endl;
    }

    ~Song()
    {
        cout << "Destructor Called" << endl;
    }
};

int main()
{
    Song s1;
    Song s2(101, "Perfect", "Ed Sheeran",

    Song s3(s2);

    s1.display();

    cout << "\\nParameterized Constructor:" << endl;

name: "Complex Numbers",
code: `#include <iostream>
using namespace std;

class Complex
{
    float real, imag;

public:
    Complex()
    {
        real = 0;
        imag = 0;
    }

    friend istream& operator>>(istream &in, Complex &c);
    friend ostream& operator<<(ostream &out, Complex c);

    Complex operator+(Complex c)
    {
        Complex temp;
        temp.real = real + c.real;
        temp.imag = imag + c.imag;
        return temp;
    }

    Complex operator-(Complex c)
    {
        Complex temp;
        temp.real = real - c.real;
        temp.imag = imag - c.imag;
        return temp;
    }

    Complex operator*(Complex c)
    {
        Complex temp;
        temp.real = real * c.real - imag * c.imag;
        temp.imag = real * c.imag + imag * c.real;
        return temp;
    }
};

istream& operator>>(istream &in, Complex &c)
{
    cout << "Enter real part: ";
    in >> c.real;

    cout << "Enter imaginary part: ";
    in >> c.imag;

    return in;
}

ostream& operator<<(ostream &out, Complex c)
{
    out << c.real << " + " << c.imag << "i";
    return out;
}

int main()
{
    Complex c1, c2, result;

    cin >> c1;

    result = c1 - c2;

}`

name: "Template Sorting",
code: `#include <iostream>
using namespace std;

template <class T>
void bubbleSort(T arr[], int n)
{
    for (int i = 0; i < n - 1; i++)
    {
        for (int j = 0; j < n - i - 1; j++)
        {
            if (arr[j] > arr[j + 1])
            {
                T temp = arr[j];
                arr[j] = arr[j + 1];
                arr[j + 1] = temp;
            }
        }
    }
}

template <class T>
void display(T arr[], int n)
{
    for (int i = 0; i < n; i++)
    {
        cout << arr[i] << " ";
    }
    cout << endl;
}

int main()
{
    int a[5] = {50, 20, 40, 10, 30};
    float b[5] = {5.5, 2.2, 4.4, 1.1, 3.3};

    cout << "Integer Array Before Sorting: ";
    display(a, 5);

    bubbleSort(a, 5);

    cout << "Integer Array After Sorting: ";
    display(a, 5);

    cout << "\\nFloat Array Before Sorting: ";
    display(b, 5);

    bubbleSort(b, 5);

    cout << "Float Array After Sorting: ";
    display(b, 5);

    return 0;
}`

name: "Item Management",

#include <vector>
#include <algorithm>
using namespace std;

class Item
{
public:
    int code;
    float cost;
    int quantity;
    string name;

    void getData()
    {
        cout << "Enter Item Code: ";
        cin >> code;

        cout << "Enter Item Name: ";
        cin >> name;

        cout << "Enter Cost: ";
        cin >> cost;

        cout << "Enter Quantity: ";
        cin >> quantity;
    }

    void display() const
    {
        cout << code << "\\t" << name << "\\t"
             << cost << "\\t" << quantity << endl;
    }
};

int main()
{
    vector<Item> items;
    int n;

    cout << "Enter number of items: ";
    cin >> n;

    for (int i = 0; i < n; i++)
    {
        Item item;
        item.getData();
        items.push_back(item);
    }

    cout << "\\nItem Records:" << endl;
    cout << "Code\\tName\\tCost\\tQuantity" << endl;

    for (const auto &item : items)
    {
        item.display();
    }

    sort(items.begin(), items.end(),
         [](const Item &a, const Item &b)
         {
             return a.code < b.code;

    cout << "\\nItems Sorted by Code:" << endl;

    for (const auto &item : items)

        item.display();
    }

    int searchCode;

    {

        it->display();

    }

// COPY FUNCTION

async function copyProgram(code, button) {

    let copied = false;

    // Modern clipboard method

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(code);
            copied = true;
        }
    }
    catch (error) {
        copied = false;
    }

    // Fallback method

    if (!copied) {

        const textarea = document.createElement("textarea");

        textarea.value = code;
        textarea.setAttribute("readonly", "");

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);

        try {
            copied = document.execCommand("copy");
        }
        catch (error) {
            copied = false;
        }

        textarea.remove();
    }

    if (copied) {

        // Kiss appears after successful copying
        showFlyingKiss(button);

        button.classList.add("copied");

        const copyText = button.querySelector(".copy-text");

        copyText.textContent = "Copied Successfully";

        showToast("CODE COPIED SUCCESSFULLY");

        setTimeout(() => {
            button.classList.remove("copied");
            copyText.innerHTML = "Copy Code &nbsp; →";
        }, 1600);

    } else {

        showToast("Copy failed. Please use Live Server.");
    }
}

// TOAST MESSAGE

let toastTimer;

function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 1800);
}
